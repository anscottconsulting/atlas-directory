# Production stack: HAPI FHIR + Postgres + Caddy (reverse proxy + static).
# Run from this directory on the EC2 host:  docker compose up -d
#
# Caddy serves the React build from ./web at "/", and reverse-proxies "/fhir"
# to the HAPI container. Basic auth on "/fhir" is enforced by the Caddyfile.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  hapi:
    image: hapiproject/hapi:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R4
      # Allow the directory app's create / update flows
      HAPI_FHIR_ALLOW_MULTIPLE_DELETE: "true"
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
      # Level 1 validation: Organization/$validate against the RCE profiles.
      # Both packages load from ./igs (synced by deploy.sh). Dependency fetching
      # stays off: RCE names its SPHD dependency "#dev", which doesn't resolve,
      # and pulling US Core's tree runs HAPI out of memory on a 2 GB box.
      # Only profiles and terminology are installed: SPHD's managingOrg
      # SearchParameter crashes HAPI when indexing new Organizations.
      HAPI_FHIR_IMPLEMENTATIONGUIDES_SPHD_NAME: sequoia.fhir.us.sphd.r4
      HAPI_FHIR_IMPLEMENTATIONGUIDES_SPHD_VERSION: 1.13.0
      HAPI_FHIR_IMPLEMENTATIONGUIDES_SPHD_PACKAGEURL: file:///igs/sphd.tgz
      HAPI_FHIR_IMPLEMENTATIONGUIDES_SPHD_INSTALLMODE: STORE_AND_INSTALL
      HAPI_FHIR_IMPLEMENTATIONGUIDES_SPHD_FETCHDEPENDENCIES: "false"
      HAPI_FHIR_IMPLEMENTATIONGUIDES_SPHD_RELOADEXISTING: "false"
      HAPI_FHIR_IMPLEMENTATIONGUIDES_SPHD_INSTALLRESOURCETYPES: StructureDefinition,ValueSet,CodeSystem
      HAPI_FHIR_IMPLEMENTATIONGUIDES_RCE_NAME: sequoia.fhir.us.rce.r4
      HAPI_FHIR_IMPLEMENTATIONGUIDES_RCE_VERSION: 1.12.0
      HAPI_FHIR_IMPLEMENTATIONGUIDES_RCE_PACKAGEURL: file:///igs/rce.tgz
      HAPI_FHIR_IMPLEMENTATIONGUIDES_RCE_INSTALLMODE: STORE_AND_INSTALL
      HAPI_FHIR_IMPLEMENTATIONGUIDES_RCE_FETCHDEPENDENCIES: "false"
      HAPI_FHIR_IMPLEMENTATIONGUIDES_RCE_RELOADEXISTING: "false"
      HAPI_FHIR_IMPLEMENTATIONGUIDES_RCE_INSTALLRESOURCETYPES: StructureDefinition,ValueSet,CodeSystem
      # The validator needs ~1 GB of heap; the JVM default (1/4 of RAM) is too small.
      JAVA_TOOL_OPTIONS: -Xmx1g
    volumes:
      - hapi-data:/data/hapi
      - ./igs:/igs:ro
    # No ports exposed — Caddy reaches HAPI on the internal Docker network only.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - hapi
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  hapi-data:
  caddy-data:
  caddy-config:
